<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="../src/assets/event_icons/state_changes.png"
      type="image/png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2263 Timeline</title>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="og:site_name" content="WOS 2263" />
    <meta property="og:title" content="2263 Calendar" />
    <meta
      property="og:description"
      content="To know when the event was or will be"
    />
    <meta property="og:url" content="https://wos2263.com/calendar/" />
    <meta
      property="og:image"
      content="https://wos2263.com/calendar-og-image.png"
    />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#6d9eeb" />
  </head>
  <body>
    <nav class="fixed top-0 w-full z-50 bg-slate-950/50">
      <div
        class="flex flex-row items-center justify-center px-6 py-4 max-w-7xl mx-auto"
      >
        <a href="/" class="ref-button">Home</a>
        <span class="ref-button selected">Calendar</span>
        <span title="WIP" class="ref-button line-through">Tools</span>
      </div>
    </nav>
    <div class="absolute inset-0 z-0 max-h-[60vh]">
      <img
        src="/src/assets/background.jpg"
        alt=""
        class="w-full h-full object-cover opacity-60"
      />
      <div
        class="absolute inset-0 bg-linear-to-b from-slate-900 via-slate-900/70 to-transparent"
      ></div>
      <div
        class="absolute inset-0 bg-linear-to-t from-slate-900 via-transparent to-transparent"
      ></div>
    </div>
    <main
      class="relative z-10 flex flex-col my-28 items-center max-h-10/12 gap-2"
    >
      <div id="next-gen-countdown">
        <img
          src="../src/assets/icons/hero_generation.png"
          alt="NewGenIcon"
        />Time until Gen 0 start:<br />00d 00h 00m 00s
      </div>
      <div
        class="bg-blue-200/20 p-2 md:p-8 rounded-2xl shadow-2xl max-w-11/12 w-full"
      >
        <div class="flex justify-between">
          <div
            class="flex flex-col gap-1 md:flex-row md:gap-4 justify-center items-center"
          >
            <span class="text-white text-[0.5rem] md:text-base">Jump to</span>
            <button id="today-button" class="control-button">Today</button>
            <input
              type="date"
              name="jump-to-date"
              id="jump-to-date"
              class="control-button"
              min="2024-12-25"
              max="2030-12-31"
            />
          </div>
          <div
            class="flex flex-col gap-1 md:flex-row md:gap-4 justify-center items-center"
          >
            <span class="text-white text-[0.5rem] md:text-base"
              >change view</span
            >
            <div id="time-buttons-container">
              <button class="control-button" time-window="3d">3 Days</button>
              <button class="control-button" time-window="1w">Week</button>
              <button
                class="control-button hidden md:inline-block!"
                time-window="2w"
              >
                2 Weeks
              </button>
              <button
                class="control-button hidden md:inline-block!"
                time-window="1m"
              >
                Month
              </button>
            </div>
          </div>
        </div>
        <div id="main-events-timeline"></div>
      </div>
    </main>

    <!-- <footer class="z-10">
        <p class="text-white text-right m-2">
          © 2026 [ONE]Przemekkk ᴼᴺᴱ | Version: 1.24
        </p>
      </footer> -->
    <footer
      class="bg-slate-950/50 flex flex-col md:flex-row justify-between items-center px-12 py-4 text-center"
    >
      <div class="text-center">
        <span class="md:text-2xl z-50 mt-8">Get Whiteout Survival</span>
        <div class="flex flex-row gap-4">
          <a
            href="https://play.google.com/store/apps/details?id=com.gof.global"
            class="z-10"
            target="_blank"
          >
            <img
              src="../src/assets/logos/googleplay.svg"
              alt="play whiteout survival"
              class="h-8 p-2 md:h-12 md:p-3 box-content"
            />
          </a>
          <a
            href="https://apps.apple.com/us/app/whiteout-survival/id6443575749"
            class="z-10"
            target="_blank"
          >
            <img
              src="../src/assets/logos/appstore.svg"
              alt="play whiteout survival"
              class="h-8 p-2 md:h-12 md:p-3 box-content"
            />
          </a>
        </div>
      </div>
      <span class="mt-4 text-xs md:text-base text-gray-400"
        >Website not affiliated with Century Games PTE. LTD.</span
      >
      <span class="mt-4 text-xs md:text-base text-gray-400"
        >© 2026 [ONE]Przemekkk ᴼᴺᴱ<br />Version: 1.3</span
      >
    </footer>
    <script type="module" src="../src/pages/calendar/calendar.ts"></script>
  </body>
</html>
